<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sparky Toolbox</title>
    <script type="importmap">{ "imports": { "three": "/web/vendor/three/three.module.min.js", "three/addons/": "/web/vendor/three/addons/" } }</script>
    <style>
      :root {
        --bg: #eceef2;
        --surface: #ffffff;
        --surface-2: #f5f6f9;
        --ink: #1a2130;
        --ink-2: #454e5f;
        --muted: #7b8494;
        --line: #dfe3e9;
        --line-2: #eceff3;
        --accent: #3d57d6;
        --accent-soft: #e6eafb;
        --ok: #2b8a5e;
        --ok-soft: #e3f3eb;
        --warn: #b0741a;
        --warn-soft: #f8eedb;
        --reply: #c2410c;
        --reply-soft: #fdece2;
        --bad: #c23c36;
        --bad-soft: #f9e4e2;
        --idle: #8a93a3;
        --expected: #cfd4dc;
        --shadow:
          0 1px 2px rgba(20, 28, 45, 0.06), 0 4px 16px rgba(20, 28, 45, 0.04);
        --side: 220px;
        --sans:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #11151b;
          --surface: #191e26;
          --surface-2: #1f252e;
          --ink: #e5e8ed;
          --ink-2: #b4bbc6;
          --muted: #838c9a;
          --line: #2b323d;
          --line-2: #232a33;
          --accent: #7d90f0;
          --accent-soft: #252c48;
          --ok: #5cbf8f;
          --ok-soft: #1c3329;
          --warn: #dca54c;
          --warn-soft: #3a2f1c;
          --reply: #f08a4b;
          --reply-soft: #3a2418;
          --bad: #e8736c;
          --bad-soft: #3d2221;
          --idle: #6f7887;
          --expected: #3a424e;
          --shadow: none;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.6 var(--sans);
        font-feature-settings: "tnum";
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 6px;
      }

      /* 左侧导航 */
      .side {
        position: fixed;
        inset: 0 auto 0 0;
        width: var(--side);
        background: var(--surface);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 26px 14px 20px;
        z-index: 30;
      }
      .brand .b-short { display: none; }
      .brand {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
        padding: 0 10px;
        line-height: 1.25;
      }
      .brand small {
        display: block;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
        margin-top: 4px;
        letter-spacing: 0;
      }
      .side nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 28px;
      }
      .side nav a {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 40px;
        padding: 0 12px;
        border-radius: 9px;
        color: var(--ink-2);
        font-size: 14.5px;
      }
      .side nav a svg {
        width: 18px;
        height: 18px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.8;
      }
      .side nav a:hover {
        background: var(--surface-2);
      }
      .side nav a.on {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .side nav a.on svg {
        opacity: 1;
      }
      .svc {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 0 12px;
        font-size: 12px;
        color: var(--muted);
      }
      .svc span {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .led {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
        flex: none;
      }
      .led.warn {
        background: var(--warn);
      }
      .led.off {
        background: var(--bad);
      }

      .main {
        margin-left: var(--side);
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 32px;
      }

      /* 运行条：一行，吸顶 */
      .dock {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--bg);
        padding: 14px 0 10px;
      }
      .now {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 44px;
        padding: 6px 8px 6px 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        font-size: 13px;
      }
      .pulse {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        position: relative;
        flex: none;
      }
      .pulse::after {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        opacity: 0;
        animation: ring 2s ease-out infinite;
      }
      .now.idle .pulse {
        background: var(--idle);
      }
      .now.idle .pulse::after {
        display: none;
      }
      @keyframes ring {
        0% {
          transform: scale(0.5);
          opacity: 0.7;
        }
        100% {
          transform: scale(1.4);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse::after {
          animation: none;
        }
      }
      .now .lbl {
        color: var(--muted);
        white-space: nowrap;
      }
      .now .task {
        font-weight: 600;
        font-size: 14px;
        white-space: nowrap;
      }
      .now a.task:hover {
        color: var(--accent);
      }
      .now .meta {
        color: var(--ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .mini {
        width: 72px;
        height: 4px;
        border-radius: 2px;
        background: var(--expected);
        overflow: hidden;
        flex: none;
      }
      .mini i {
        display: block;
        height: 100%;
        background: var(--accent);
      }
      .mini.over i {
        background: var(--warn);
      }
      .now .end {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
      }
      .pend {
        font-size: 12px;
        padding: 2px 10px;
        border-radius: 999px;
        background: var(--warn-soft);
        color: var(--warn);
        white-space: nowrap;
        border: 0;
        cursor: pointer;
        font-family: inherit;
      }
      .pend-wrap { position: relative; }
      .pend-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: min(380px, calc(100vw - 32px)); max-height: 60vh; overflow: auto;
        padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(20, 28, 45, 0.16); }
      .pend-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; padding: 8px 10px; border-radius: 7px; font-size: 13px; color: var(--ink); }
      .pend-row:hover { background: var(--surface-2); }
      .pend-row .st-tag { font-size: 11.5px; padding: 0 7px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); }
      .pend-row .muted { font-size: 12px; }
      .pend-note { flex-basis: 100%; font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      main {
        padding: 10px 0 80px;
      }
      h1 {
        font-size: 26px;
        font-weight: 650;
        margin: 6px 0 4px;
        letter-spacing: -0.01em;
      }
      h2 {
        font-size: 17px;
        font-weight: 620;
        margin: 0;
      }
      h3 {
        font-size: 14px;
        font-weight: 620;
        margin: 0 0 12px;
        color: var(--ink-2);
      }
      .lead {
        color: var(--muted);
        margin: 0 0 24px;
        max-width: 72ch;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 20px 22px;
        margin-bottom: 20px;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .card-head .hint {
        color: var(--muted);
        font-size: 13px;
      }
      .spacer {
        margin-left: auto;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .mono {
        font-family: var(--mono);
        font-size: 12.5px;
      }

      .btn {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 8px;
        padding: 5px 12px;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: var(--muted);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn.primary:hover {
        filter: brightness(1.08);
      }
      .btn.danger {
        color: var(--bad);
        border-color: var(--bad);
      }
      .btn.sm {
        padding: 3px 10px;
        font-size: 12.5px;
      }
      .btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .seg {
        display: inline-flex;
        background: var(--surface-2);
        border-radius: 9px;
        padding: 3px;
        gap: 2px;
      }
      .seg button {
        border: 0;
        background: none;
        padding: 4px 12px;
        border-radius: 7px;
        font-size: 13px;
        cursor: pointer;
        color: var(--ink-2);
      }
      .seg button.on {
        background: var(--surface);
        color: var(--ink);
        box-shadow: var(--shadow);
        font-weight: 600;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 550;
        color: var(--ink-2);
        padding: 7px 14px 7px 10px;
        margin: 0 0 8px -10px;
        border-radius: 9px;
      }
      .back::before {
        content: "‹";
        font-size: 22px;
        line-height: 1;
        margin-top: -2px;
      }
      .back:hover {
        background: var(--surface);
        color: var(--accent);
      }

      /* 状态标签：颜色之外总带一个符号和文字 */
      .st {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 550;
        padding: 1px 9px;
        border-radius: 999px;
        white-space: nowrap;
        line-height: 20px;
      }
      .st::before {
        content: attr(data-ico);
        font-weight: 700;
      }
      .st.running {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .st.complete,
      .st.on {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .st.partial,
      .st.waiting {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .st.paused,
      .st.off,
      .st.queued,
      .st.resuming {
        background: var(--surface-2);
        color: var(--ink-2);
      }
      .st.failed,
      .st.timeout {
        background: var(--bad-soft);
        color: var(--bad);
      }

    </style>
    <link rel="stylesheet" href="/console/console.css" />
    <style>
      /* 聊天 */
      #view.chatwrap { max-width: 1480px; padding-top: 0; padding-bottom: 0; }
      .chat { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; height: calc(100vh - 68px); }
      .conv-col { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 12px 12px 0 0; box-shadow: var(--shadow); }
      .conv-col.dragging { outline: 2px dashed var(--accent); outline-offset: -6px; }
      .conv { flex: 1; overflow: auto; padding: 18px 22px 8px; overflow-wrap: anywhere; }   /* 没空格的长串（路径、斜杠连起来的字段名）就地折行，不把对话撑出左右滑动 */
      .older { text-align: center; margin-bottom: 12px; }
      .turn { padding: 4px 0 10px; }
      .citem + .citem > .turn { border-top: 1px solid var(--line-2); padding-top: 12px; }
      .msg { padding: 6px 0; }
      .msg.me.sending { opacity: 0.6; }
      .msg.me { transition: opacity 0.25s; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: start; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 9px 14px 9px 12px; margin: 4px 0 8px; }
      .msg.bot { padding: 2px 0 6px 27px; }
      .reply { background: var(--reply-soft); border-left: 3px solid var(--reply); border-radius: 0 8px 8px 0; padding: 9px 14px; margin: 4px 0 8px; }
      .reply .att-grid, .reply .doc-w, .reply .aud-w { margin-top: 8px; }
      .prompt { color: var(--accent); font-weight: 700; font-family: var(--mono); line-height: 1.6; }
      .umeta { display: flex; align-items: center; gap: 8px; white-space: nowrap; padding-top: 2px; }
      .msg.me .chan { background: var(--surface); }
      .umeta .chan { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }   /* 计划来源这类长标签不挤正文 */
      .mbody { min-width: 0; }
      .mhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
      .mhead b { font-size: 14.5px; }
      .mt { font-size: 12px; color: var(--muted); }
      .chan { font-size: 11px; padding: 0 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); line-height: 18px; }
      .chan.web { background: var(--accent-soft); color: var(--accent); }
      .mtext { font-size: 14.5px; line-height: 1.65; overflow-wrap: anywhere; max-width: 78ch; }
      .md-p + .md-p, .md-quote + .md-p, .md-p + .md-quote { margin-top: 4px; }
      .md-quote { border-left: 4px solid var(--line); padding: 0 0 0 12px; color: var(--ink-2); }
      .md-h1 { font-size: 20px; font-weight: 700; margin: 6px 0 2px; }
      .md-h2 { font-size: 17px; font-weight: 700; margin: 6px 0 2px; }
      .md-h3 { font-size: 15px; font-weight: 700; margin: 4px 0 2px; }
      .md-sub { font-size: 12px; color: var(--muted); }
      .mtext ul, .mtext ol { margin: 2px 0; padding-left: 22px; }
      .md-code { font-family: var(--mono); font-size: 12.5px; line-height: 1.55; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .md-inline { font-family: var(--mono); font-size: 0.88em; background: var(--surface-2); border-radius: 4px; padding: 1px 4px; }
      .mtext a { color: var(--accent); }
      .mtext a:hover { text-decoration: underline; }
      .spoiler { background: var(--ink-2); color: transparent; border-radius: 4px; cursor: pointer; padding: 0 2px; }
      .spoiler.shown { background: var(--surface-2); color: inherit; }
      .att-grid { display: grid; gap: 6px; margin-top: 6px; max-width: 440px; grid-template-columns: 1fr 1fr; }
      .att-grid.n1 { grid-template-columns: 1fr; max-width: 380px; }
      .att { position: relative; padding: 0; border: 0; background: var(--surface-2); border-radius: 8px; overflow: hidden; cursor: zoom-in; aspect-ratio: 4 / 3; }
      .att-grid.n1 .att { aspect-ratio: auto; max-height: 340px; }
      span.att { display: block; cursor: default; }   /* 刚发的消息里的图：还没存到服务器，先不能点开 */
      .att img, .att video { display: block; width: 100%; height: 100%; object-fit: cover; }
      .att-grid.n1 .att img { object-fit: contain; max-height: 340px; }
      .att .play { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 26px; font-style: normal; background: rgba(0, 0, 0, 0.25); }
      .doc { display: inline-flex; align-items: center; gap: 8px; margin: 6px 8px 0 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 13px; max-width: 320px; }
      .doc svg { width: 18px; height: 18px; flex: none; stroke: var(--muted); fill: none; stroke-width: 1.7; }
      .doc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .doc:hover { border-color: var(--muted); }
      .trace { margin: 2px 0 8px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; max-width: 86ch; }
      .tc summary { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-weight: 400; list-style: none; cursor: pointer; }
      .tc summary::before { content: none; }
      .tc summary b { font-weight: 600; white-space: nowrap; }
      .dot2 { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ok); }
      .tc.run .dot2 { background: var(--accent); animation: blink 1.2s ease-in-out infinite; }
      .tc.err .dot2 { background: var(--bad); }
      @keyframes blink { 50% { opacity: 0.3; } }
      .tc-desc { color: var(--muted); font-size: 12px; margin: -2px 0 4px 22px; }
      .tc-desc::before { content: "⎿ "; opacity: 0.6; }
      .tc-desc-full { margin: 0 0 6px; }
      .targs { color: var(--muted); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .ak { color: var(--ink-2); }
      .tdur { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; padding-left: 8px; }
      .tc-io { margin: 2px 0 8px 16px; }
      .tc-io pre { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border-radius: 6px; padding: 8px 10px; margin: 2px 0 6px; max-height: 240px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
      .io-l { font-size: 11.5px; color: var(--muted); }
      .sub-io { font-size: 12.5px; color: var(--ink-2); margin: 2px 0 6px; }
      .tsub { color: var(--muted); font-weight: 400; }
      .sub-io p { margin: 4px 0; }
      .sub-src { margin: 2px 0 6px; padding-left: 20px; }
      .sub-src a { color: var(--accent); overflow-wrap: anywhere; }
      .sub-io .qa b { font-weight: 600; color: var(--ink); }
      .tc-say { color: var(--ink-2); font-size: 13px; border-left: 2px solid var(--line); padding: 1px 0 1px 10px; margin: 3px 0; }
      .typing { display: inline-flex; gap: 4px; padding: 8px 0; }
      .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s ease-in-out infinite; }
      .typing i:nth-child(2) { animation-delay: 0.2s; }
      .typing i:nth-child(3) { animation-delay: 0.4s; }
      @media (prefers-reduced-motion: reduce) { .typing i, .tc.run .dot2 { animation: none; } }
      .tfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
      .tfoot a:hover { color: var(--accent); }
      /* 聊天里的卡片：白底细边框；卡头 = 图标 + 标题 + 来自哪个任务 + 状态；按钮在底栏；处理过的折成一行 */
      .ccard { border: 1px solid var(--line); border-radius: 12px; margin: 10px 0; background: var(--surface); max-width: 620px; box-shadow: 0 1px 2px rgba(15, 18, 30, 0.04); overflow: hidden; }
      .cc-head { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px 0; }
      .cc-tt { padding-top: 4px; }
      .cc-state { margin-top: 3px; }
      .cc-ico { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--warn-soft); color: var(--warn); }
      .ccard.is-ask .cc-ico { background: var(--accent-soft); color: var(--accent); }
      .cc-ico svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .cc-tt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
      .cc-title { min-width: 0; font-weight: 600; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
      .cc-from { font-size: 11.5px; color: var(--muted); }
      .ccard.done .cc-from { flex: none; }
      .cc-ico.bell { background: var(--surface-2); color: var(--ink-2); }
      .cc-state { flex: none; font-size: 11.5px; color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 2px 8px; }
      .ccard.is-ask .cc-state { color: var(--accent); background: var(--accent-soft); }
      .cc-main { padding: 10px 16px 14px; }

    <script src="/console/console.js"></script>
    <script>
// ---------- 聊天（私信任务的网页入口） ----------
const CHAT = {
  echo: [],   // 刚发出、对话记录里还没出现的消息
  blobOf: new Map(),   // 服务器上的图片路径 → 发送时的本地预览地址
  hist: null,
  status: null,
  sig: "",
  open: new Set(),
  io: new Map(),
  modal: {},
  files: [],
  sending: false,
  tick: 0,
  older: [],
  more: false,
  toolOpen: new Set(),
  turnOpen: new Set(),      // 点开了工具过程的折叠轮（跑完的轮默认只显示一行「N 次工具调用」）
  turnEv: new Map(),        // 折叠轮点开后取到的工具过程（/api/chat/turn）：运行 id → events
  cardFull: new Map(),      // 点开过的已处理卡片的完整内容（/api/chat/card）：卡片 id → card
  full: new Map(),          // 展开过的工具调用的完整参数与结果（/api/chat/call）：<运行 id>:<调用 id> → {start, end}；对话列表里只有摘要
  cmdSel: 0,
  stick: true,
};
// 命令：来自命令表 data/messages/commands.json（私信任务各自登记，状态接口的 commands）；一个命令一行，写全用法；
// base 是命令本身，fill 是选中后填进输入框的内容（参数接着打，回车执行）
const cmdList = () => CHAT.status?.commands || [];
// 补全用的具体写法：一种用法一条（打 /uncensored of 只剩 /uncensored off）
const completions = () =>
  cmdList().flatMap((c) => {
    const choices = (c.args || []).flatMap((a) => a.choices || []);
    const req = (c.args || []).some((a) => a.required);
    return [
      ...(req ? [] : [[c.name, c.description]]),
      ...choices.map((ch) => [`${c.name} ${ch.value}`, `${c.description}（${ch.name}）`]),
    ];
  });
const allCommands = () =>
  cmdList().map((c) => ({
    base: c.name,
    usage: [c.name, ...(c.args || []).map((a) => {
      const vals = (a.choices || []).map((ch) => ch.value).join("|") || a.name;
      return a.required ? `<${vals}>` : `[${vals}]`;
    })].join(" "),
    fill: c.name,
    desc: c.description,
  }));
const fileUrl = (rel) => `/api/chat/file?p=${encodeURIComponent(rel)}`;
const isImg = (p) => /\.(png|jpe?g|webp|gif)$/i.test(p);
const isVid = (p) => /\.(mp4|webm|mov)$/i.test(p);
const isAud = (p) => /\.(mp3|m4a|aac|wav|ogg|opus|flac)$/i.test(p);
const is3d = (p) => /\.(glb|gltf)$/i.test(p);   // 3D 模型：卡片点开是可拖动缩放的查看器（frontend/viewer3d.js，按需加载）
const baseName = (p) => String(p).split("/").pop();
const kb = (n) =>
  n >= 1e9
    ? `${(n / 1e9).toFixed(1)} GB`
    : n >= 1e6
      ? `${(n / 1e6).toFixed(1)} MB`
      : `${Math.round(n / 1e3)} KB`;
const tok = (n) => (n >= 1000 ? `${(n / 1000).toFixed(1)}k` : String(n ?? 0));

// Discord 风格的 Markdown：代码块、行内代码、粗斜体、下划线、删除线、剧透、引用、标题、小字、列表、链接
function md(src) {
  const keep = [];
  const hold = (html) => `\u0000${keep.push(html) - 1}\u0000`;
  let s = String(src ?? "");
  s = s.replace(/```([\w+-]*)\n?([\s\S]*?)```/g, (_, _lang, body) =>
    hold(`<pre class="md-code">${esc(body.replace(/\n$/, ""))}</pre>`),
  );
  s = s.replace(/`([^`\n]+)`/g, (_, c) =>
    hold(`<code class="md-inline">${esc(c)}</code>`),
  );
  s = esc(s);
  const link = (u, text) =>
    hold(
      `<a href="${u}" target="_blank" rel="noopener noreferrer">${text}</a>`,
    );
  const inline = (t) =>
    t
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, a, u) =>
        link(u, a),
      )
      .replace(
        /(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g,
        (_, pre, u) => pre + link(u, u),
      )
      .replace(/\*\*\*([^*\n]+)\*\*\*/g, "<b><i>$1</i></b>")
      .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
      .replace(/__([^_\n]+)__/g, "<u>$1</u>")
      .replace(/(^|[^\w*])\*([^*\n]+)\*(?!\w)/g, "$1<i>$2</i>")
      .replace(/(^|[^\w])_([^_\n]+)_(?!\w)/g, "$1<i>$2</i>")
      .replace(/~~([^~\n]+)~~/g, "<s>$1</s>")
      .replace(
        /\|\|([^|\n]+)\|\|/g,
        '<span class="spoiler" tabindex="0">$1</span>',
      );
  const rows = [];
  let quoteRest = false;
  for (let line of s.split("\n")) {
    let q = quoteRest;
    let m;
    if ((m = line.match(/^&gt;&gt;&gt; ?(.*)$/))) {
      quoteRest = q = true;
      line = m[1];
    } else if ((m = line.match(/^&gt; ?(.*)$/))) {
      q = true;
      line = m[1];
    }
    let html,
      block = true,
      list = null;
    if ((m = line.match(/^(#{1,3}) (.+)$/)))
      html = `<div class="md-h${m[1].length}">${inline(m[2])}</div>`;
    else if ((m = line.match(/^-# (.+)$/)))
      html = `<div class="md-sub">${inline(m[1])}</div>`;
    else if ((m = line.match(/^\s*[-*] (.+)$/))) {
      html = inline(m[1]);
      list = "ul";
    } else if ((m = line.match(/^\s*\d+\. (.+)$/))) {
      html = inline(m[1]);
      list = "ol";
    } else {
      html = inline(line);
      block = false;
    }
    rows.push({ html, block, list, q });
  }
  let out = "",
    i = 0;
  const run = (from, to) => {
    let h = "";
    for (let k = from; k < to; k++) {
      const r = rows[k];
      if (r.list) {
        let e = k;
        while (e + 1 < to && rows[e + 1].list === r.list) e++;
        h += `<${r.list}>${rows
          .slice(k, e + 1)
          .map((x) => `<li>${x.html}</li>`)
          .join("")}</${r.list}>`;
        k = e;
      } else if (r.block) h += r.html;
      else
        h +=
          r.html +
          (k + 1 < to && !rows[k + 1].block && !rows[k + 1].list ? "<br>" : "");
    }
    return h;
  };
  while (i < rows.length) {
    let j = i;
    while (j < rows.length && rows[j].q === rows[i].q) j++;
    const body = run(i, j);
    out += rows[i].q
      ? `<div class="md-quote">${body}</div>`
      : `<div class="md-p">${body}</div>`;
    i = j;
  }
  return out.replace(/\u0000(\d+)\u0000/g, (_, n) => keep[n]);
}

function attachHTML(list) {
  const all = (list || []).filter(Boolean);
  if (!all.length) return "";
  const media = all.filter((p) => isImg(p) || isVid(p) || is3d(p)),
    auds = all.filter(isAud),
    docs = all.filter((p) => !isImg(p) && !isVid(p) && !isAud(p) && !is3d(p));
  return `${
    media.length
      ? `<div class="att-grid n${Math.min(media.length, 4)}">${media
          .map((p) =>
            is3d(p)
              ? `<div class="att-w"><button class="att m3d" data-lb="${esc(fileUrl(p))}" data-dl="${esc(p)}" data-kind="3d"><span class="m3d-in"><svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7z" /><path d="M3 7l9 5 9-5M12 12v10" /></svg>3D 模型<small>点开拖动查看</small></span></button>${dlLink(p)}</div>`
              : isVid(p)
              ? `<div class="att-w"><button class="att" data-lb="${esc(fileUrl(p))}" data-dl="${esc(p)}" data-kind="video"><video src="${esc(fileUrl(p))}#t=0.1" preload="metadata" muted></video><i class="play">▶</i></button>${dlLink(p)}</div>`
              : `<div class="att-w"><button class="att" data-lb="${esc(fileUrl(p))}" data-dl="${esc(p)}" data-kind="image"><img src="${esc(CHAT.blobOf.get(p) || `${fileUrl(p)}&w=720`)}" loading="lazy" decoding="async" alt="${esc(baseName(p))}" /></button>${dlLink(p)}</div>`,
          )
          .join("")}</div>`
      : ""
  }
          ${auds.map((p) => `<div class="aud-w"><audio controls preload="metadata" src="${esc(fileUrl(p))}" title="${esc(shownName(p))}"></audio>${dlLink(p)}</div>`).join("")}
          ${docs.map((p) => `<span class="doc-w"><a class="doc" href="${esc(fileUrl(p))}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" /><path d="M14 3v6h6" /></svg><span>${esc(shownName(p))}</span></a>${dlLink(p)}</span>`).join("")}`;
}
// 下载：服务器加 Content-Disposition，浏览器直接存进「下载」文件夹
const shownName = (p) => baseName(p).replace(/^web\d+-\d+-|^\d{10,}-\d+-/, "");
const DL_ICON = `<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" /></svg>`;
const dlLink = (p) => `<a class="dl" href="${esc(fileUrl(p))}&dl=1" download="${esc(shownName(p))}" title="下载 ${esc(shownName(p))}" aria-label="下载">${DL_ICON}</a>`;
const chanTag = (c, label) =>
  c === "web"
    ? `<span class="chan web">${esc(label || "网页")}</span>`
    : `<span class="chan">Discord</span>`;
function msg(who, ts, body, tags = "") {
  const d = ts ? toDate(ts) : null;
  if (who !== "me") return `<div class="msg bot">${body}</div>`;
  return `<div class="msg me"><span class="prompt">›</span><div class="mbody">${body}</div>
          <div class="umeta">${tags}<span class="mt" title="${d ? d.toLocaleString() : ""}">${d ? when(d) : ""}</span></div></div>`;
}

// shell 调用照 Claude Code 显示：Shell(命令) + 下一行说明，展开看完整命令，不显示原始 JSON
const shellIO = (a) => `${a.description ? `<div class="io-l">说明</div><p class="tc-desc-full">${esc(a.description)}</p>` : ""}<div class="io-l">命令${a.timeout ? `（时限 ${esc(String(a.timeout))}）` : ""}</div><pre>${esc(a.command)}</pre>`;
function argSummary(a) {
  if (!a || typeof a !== "object") return "";
  return Object.entries(a)
    .slice(0, 3)
    .map(([k, v]) => {
      const s = typeof v === "string" ? v : JSON.stringify(v);
      return `<span class="ak">${esc(k)}</span>: ${esc(s.length > 70 ? s.slice(0, 70) + "…" : s)}`;
    })
    .join(", ");
}
// 这一轮的过程按时间排：工具调用、模型的中间说明、卡片、回复穿插着来（时间都换算成绝对时间，见 webchat._events）
const ioHTML = (e, end) =>
  `<div class="tc-io">${e.info ? `${e.src ? `<div class="io-l">来源</div><p class="sub-src">${/^https?:\/\//.test(e.src) ? `<a href="${esc(e.src)}" target="_blank" rel="noopener noreferrer">${esc(e.src)}</a>` : esc(e.src)}</p>` : ""}${e.args ? `<div class="io-l">参数</div><pre>${esc(JSON.stringify(e.args, null, 2))}</pre>` : `<div class="io-l">调用记录</div><pre>${esc(JSON.stringify(e.info, null, 2))}</pre>`}` : isShell(e) ? shellIO(e.args) : `<div class="io-l">参数</div><pre>${esc(JSON.stringify(e.args, null, 2))}</pre>`}${end ? `<div class="io-l">${end.error ? "出错" : "结果"}</div><pre>${esc(end.result)}</pre>${end.approval ? `<div class="io-l">附带：Joy 的回答（网关一并交给模型）</div><pre>${esc(end.approval)}</pre>` : ""}` : ""}${subHTML(e.sub)}</div>`;
// 子代理这次调用做了什么：浏览器的逐步记录，研究 / 读者的摘要、来源、回答（内容来自网页，只当文字显示）
function subHTML(s) {
  if (!s) return "";
  const u = s.usage || {};
  const facts = [u.wall_seconds != null && `用时 ${dur(u.wall_seconds)}`, u.search_calls && `搜索 ${u.search_calls} 次`, u.pages_fetched && `打开 ${u.pages_fetched} 个网页`, u.model_calls && `调用模型 ${u.model_calls} 次`].filter(Boolean).join("，");
  if (!s.summary && !s.answers?.length) return "";
  return `<div class="io-l">子代理的回答</div><div class="sub-io">${s.summary ? `<p>${esc(s.summary)}</p>` : ""}${s.answers?.length ? s.answers.map((a) => `<div class="qa"><b>${esc(a.q)}</b><span>${esc(a.a)}</span></div>`).join("") : ""}</div>`;
}
// 子代理这次调过的工具：和主代理的调用一样一行一个，排在它那次调用下面，标「子代理 › 工具」，展开看调用记录与结果
// 子代理的每次调用各是一条，带自己的开始时间：和主代理的调用、卡片、回复一起按时间排（卡片会插在调用之间）
function subCalls(e, key, meta) {
  return (e.sub?.calls || [])
    .map((x, j) => {
      const k = `${key}:${j}`;
      CHAT.io.set(k, [null, null, { ...meta, j }]);
      return `<details class="tc ${x.running ? "run" : x.error ? "err" : "ok"}" data-k="${k}" ${CHAT.open.has(k) ? "open" : ""}><summary><i class="dot2"></i><b><span class="tsub">${esc(e.tool)} ›</span> ${esc(x.tool)}</b><span class="targs">(${x.args ? argSummary(x.args) : esc(x.arg || "")})${x.brief ? ` → ${esc(x.brief)}` : ""}</span>
            <span class="tdur" ${x.running && x.at ? `data-since="${x.at}"` : ""}>${x.ms != null ? dur(x.ms / 1000) : x.running ? (x.at ? `进行中 ${dur(Date.now() / 1000 - x.at)}` : "进行中…") : ""}</span></summary>${CHAT.open.has(k) ? ioFor(k) : ""}</details>`;
    })
    .map((h, j) => ({ at: e.sub.calls[j].at ?? e.at, trace: true, h }));
}
// 展开一条工具调用时才取它的完整参数与结果：io 是 [摘要里的 start, end, {run, id, j?}]（j = 子代理调过的第几个工具）；没取到前先显示「加载中」
function ioFor(k) {
  const [e, end, m] = CHAT.io.get(k) || [];
  const f = m && CHAT.full.get(`${m.run}:${m.id}`);
  if (!f) {
    if (m) loadCall(m.run, m.id);
    return `<div class="tc-io"><div class="muted small">加载中…</div></div>`;
  }
  if (m.j == null) return ioHTML(f.start, f.end);
  const x = f.start.sub?.calls?.[m.j];
  return x ? ioHTML({ tool: `${f.start.tool} › ${x.tool}`, info: x.info || {}, src: x.arg, args: x.args }, x.running ? null : { result: x.result, error: x.error }) : `<div class="tc-io"><div class="muted small">没有这次调用的记录</div></div>`;
}
const CALL_LOADING = new Set();
async function loadTurn(run) {
  if (CALL_LOADING.has(`turn:${run}`)) return;
  CALL_LOADING.add(`turn:${run}`);
  try {
    CHAT.turnEv.set(run, (await api(`/api/chat/turn?run=${encodeURIComponent(run)}`)).events);
    redrawConv(true);
  } catch (e) {
    CHAT.turnOpen.delete(run);
    toast(e.message, true);
  } finally {
    CALL_LOADING.delete(`turn:${run}`);
  }
}
// 已处理的卡在对话列表里只有标题那一行（brief），点开再取完整的
async function loadCard(id) {
  if (CALL_LOADING.has(`card:${id}`)) return;
  CALL_LOADING.add(`card:${id}`);
  try {
    CHAT.cardFull.set(id, await api(`/api/chat/card?id=${encodeURIComponent(id)}`));
    redrawConv(true);
  } catch (e) {
    toast(e.message, true);
  } finally {
    CALL_LOADING.delete(`card:${id}`);
  }
}
async function loadCall(run, id) {
  const ck = `${run}:${id}`;
  if (CALL_LOADING.has(ck)) return;
  CALL_LOADING.add(ck);
  try {
    const f = await api(`/api/chat/call?run=${encodeURIComponent(run)}&id=${encodeURIComponent(id)}`);
    CHAT.full.set(ck, f);
    for (const d of document.querySelectorAll("details[data-k][open]")) {   // 展开着的、属于这次调用的（连同子代理调过的工具）换上完整内容
      const m = CHAT.io.get(d.dataset.k)?.[2];
      if (m && `${m.run}:${m.id}` === ck) { d.querySelector(".tc-io")?.remove(); d.insertAdjacentHTML("beforeend", ioFor(d.dataset.k)); }
    }
    if (!f.end) CHAT.full.delete(ck);                       // 还没结束的调用不留：下次展开再取最新的
  } catch (e) {

// win（可选）：只画落在 [from, to) 里的（一轮被别的消息隔开时分段画）；没时间的算最后一段
function flowHTML(t, win) {
  const open = t.folded && CHAT.turnOpen.has(t.run_id);
  const evs = !t.folded ? t.events : open ? CHAT.turnEv.get(t.run_id) || [] : [];
  const ends = {};
  for (const e of evs) if (e.ev === "tool_end") ends[e.id] = e;
  const replyTexts = new Set(t.replies.map((r) => r.text.trim()));
  const items = [];
  if (t.folded && (t.folded.calls || t.folded.says)) {           // 跑完的轮：工具过程折成一行，点开取（/api/chat/turn）
    if (open && !CHAT.turnEv.has(t.run_id)) loadTurn(t.run_id);
    const n = [t.folded.calls && `${t.folded.calls} 次工具调用`, t.folded.says && `${t.folded.says} 段说明`].filter(Boolean).join("，");
    items.push({ at: t.folded.at, trace: true, h: `<button class="tfold" data-turnfold="${esc(t.run_id)}"><i class="caret ${open ? "open" : ""}">›</i>${open ? (CHAT.turnEv.has(t.run_id) ? `收起 ${n}` : "加载中…") : n}</button>` });
  }
  evs.forEach((e, i) => {
    if (e.ev === "assistant" && e.text && !replyTexts.has(e.text.trim()))
      items.push({ at: e.at, trace: true, h: `<div class="tc-say">${md(e.text.trim())}</div>` });
    if (e.ev !== "tool_start" || e.tool === "reply") return;
    const end = ends[e.id];
    const key = `tc:${t.run_id}:${i}`;
    const state = !end ? "run" : end.error ? "err" : "ok";
    items.push({ at: e.at, trace: true, h: `<details class="tc ${state}" data-k="${key}" ${CHAT.open.has(key) ? "open" : ""}><summary><i class="dot2"></i><b>${isShell(e) ? "Shell" : esc(e.tool)}</b><span class="targs">(${isShell(e) ? esc(e.args.command.split("\n")[0].slice(0, 160)) : argSummary(e.args)})</span>
            <span class="tdur" ${!end && t.status === "running" && e.at ? `data-since="${e.at}"` : ""}>${end ? dur((end.ms || 0) / 1000) : t.status === "running" && e.at ? `进行中 ${dur(Date.now() / 1000 - e.at)}` : "进行中…"}</span></summary>
            ${CHAT.open.has(key) ? (CHAT.io.set(key, [e, end, { run: t.run_id, id: e.id }]), ioFor(key)) : ""}</details>${isShell(e) && e.args.description ? `<div class="tc-desc">${esc(e.args.description)}</div>` : ""}` });
    items.push(...subCalls(e, key, { run: t.run_id, id: e.id }));
    CHAT.io.set(key, [e, end, { run: t.run_id, id: e.id }]);
  });
  for (const c of t.cards) items.push({ at: c.created, h: cardHTML(c) });
  for (const r of t.replies) items.push({ at: r.ts, h: `<div class="reply">${r.text ? `<div class="mtext">${md(r.text)}</div>` : ""}${attachHTML(r.files)}</div>` });   // Sparky 的回复：橙色高亮（同我发的消息，不带 ›）
  const at = (x) => (x.at == null ? Infinity : x.at);
  items.sort((a, b) => at(a) - at(b));
  let out = "", buf = "";
  for (const x of win ? items.filter((x) => at(x) >= win.from && at(x) < win.to) : items) {
    if (x.trace) { buf += x.h; continue; }
    if (buf) { out += `<div class="trace">${buf}</div>`; buf = ""; }
    out += x.h;
  }
  return out + (buf ? `<div class="trace">${buf}</div>` : "");
}

// win：这一轮的哪一段 {from, to, first, last}（别的任务的通知、卡片、命令插在中间时一轮分成几段，按时间穿插）；不给 = 整轮

    "me",
    t.first_started || t.started,

      `${chanTag(x.channel)}<span class="chan">插话</span>`,

    ? `<span ${tk !== t.tokens && t.tokens ? `title="其中主代理 入 ${tok(t.tokens.input)} / 出 ${tok(t.tokens.output)}"` : ""}>token 入 ${tok(tk.input)} / 出 ${tok(tk.output)}</span>`

const tsec = (v) => (v == null ? null : typeof v === "number" ? v : Date.parse(v) / 1000);

// 有还没处理的卡就从最早那张起不再切，那一段连同卡整段排在最下面（审批卡优先）
function turnItems(t, cuts) {
  const start = tsec(t.first_started || t.started) ?? 0;
  const end = t.status === "running" || !t.ended ? Infinity : tsec(t.ended);
  const pendAt = Math.min(...(t.cards || []).filter((c) => !c.resolved).map((c) => c.created ?? Infinity));
  const cs = [...new Set(cuts.filter((x) => x > start && x < end && x < pendAt))].sort((a, b) => a - b);
  const bounds = [-Infinity, ...cs, Infinity];
  const out = [];
  for (let k = 0; k < bounds.length - 1; k++) {
    const win = { from: bounds[k], to: bounds[k + 1], first: k === 0, last: k === bounds.length - 2 };
    const h = turnHTML(t, win);
    if (!win.first && !win.last && !h.includes('class="trace"') && !h.includes("ccard") && !h.includes('class="reply"') && !h.includes('class="msg me"')) continue;   // 中间空着的段不画
    out.push({ key: k ? `t:${t.run_id}:${k}` : `t:${t.run_id}`, ts: k ? bounds[k] + 1e-6 : start, pend: win.last && pendAt < Infinity, h });

function convItems() {
  const H = CHAT.hist;
  if (!H) return [{ key: "loading", h: `<div class="empty">加载中…</div>` }];
  const ech = echoes(H);   // 先对上刚发的消息：下面排队那条要不要另画、那一轮的图用不用本地预览，都看它
  // 一轮之外的消息（命令、系统通知、定时任务的消息、已处理的后台卡）按时间穿插进一轮里，把它切成几段
  const cuts = [...H.system.map((s) => s.ts), ...(H.notices || []).map((n) => n.ts), ...(H.crons || []).map((c) => c.ts),

  const items = [
    ...[...CHAT.older, ...H.turns].flatMap((t, _, all) => turnItems(t, [...cuts,   // 一轮停着等卡时发的消息另起了一轮、或还在排队：也把这一轮切开，后面的步骤排到它们之后
      ...all.filter((u) => u !== t).flatMap((u) => [tsec(u.first_started || u.started), u.status === "running" ? null : tsec(u.ended)]),
      ...H.queued.map((q) => q.ts), ...ech.map((e) => e.ts)].filter((x) => x != null))),
    ...H.system.map((s) => ({ key: `s:${s.ts}`, ts: s.ts, h: `<div class="sysline"><code>${esc(s.command)}</code>${md(s.reply)}</div>` })),
    ...(H.notices || []).map((n) => ({ key: `n:${n.ts}`, ts: n.ts, h: `<div class="notice"><span class="chan">系统通知</span><span class="mt">${esc(when(toDate(n.ts)))}</span><div class="mtext">${md(n.text)}</div></div>` })),   // 平台直接发 Discord 的通知（builder 部署结果、紧急任务提醒…），和私信里一样按时间出现
    ...(H.crons || []).map((c) => ({ key: `r:${c.ts}`, ts: c.ts, h: `<div class="notice"><span class="chan">📬 ${esc(c.task)}</span><span class="mt">${esc(when(toDate(c.ts)))}</span>${c.text ? `<div class="mtext">${md(c.text)}</div>` : ""}${attachHTML(c.files)}</div>` })),   // 定时任务的消息（和 Discord 私信里一样按时间出现，附件照常）
    ...(H.cards || []).map((c) => ({ key: `c:${c.id}`, ts: c.created, pend: !c.resolved, h: `<div class="turn">${cardHTML(c)}</div>` })),   // 后台发的卡（如紧急任务的登记 / 取消）和别的任务的卡（标来自哪个任务），不属于哪一轮
    ...H.queued.filter((q) => !CHAT.echo.some((e) => e.q === q)).map((q) => ({
      key: `q:${q.ts}`,
      ts: q.ts,
      h: msg(
        "me",
        q.ts,
        `<div class="mtext">${md(q.text.replace(/\n?（附图 \d+ 张，已随消息附上）$/, ""))}</div>${attachHTML([...q.images, ...q.files.map((f) => `inbox/${f}`)])}`,
        `${chanTag(q.channel)}<span class="chan">${q.loading ? "加载模型中" : jumpsQueue(q) ? "插队中" : "排队中"}</span>`,
      ),
    })),
    ...ech.map((e) => ({
      key: `e:${e.ts}`,
      ts: e.ts,
      h: `<div class="turn">${msg(
        "me",
        e.ts,
        `${e.text ? `<div class="mtext">${md(e.text)}</div>` : ""}${e.imgs.length ? `<div class="att-grid n${Math.min(e.imgs.length, 4)}">${e.imgs.map((u) => `<div class="att-w"><span class="att"><img src="${esc(u)}" alt="" /></span></div>`).join("")}</div>` : ""}${e.docs.map((n) => `<div class="mtext muted">${esc(n)}</div>`).join("")}`,
        `${e.q ? `${chanTag(e.q.channel)}<span class="chan">${e.q.loading ? "加载模型中" : jumpsQueue(e.q) ? "插队中" : "排队中"}</span>` : `<span class="chan">${e.sent ? "已发送" : "发送中"}</span>`}`,

  if (!items.length) items.push({ key: "empty", h: `<div class="empty">还没有对话。发一条消息开始，输入 / 查看命令</div>` });
  if (CHAT.more) items.unshift({ key: "older", h: `<div class="older"><button class="btn sm" data-older>加载更早的对话</button></div>` });

}
// 刚发的消息：对话记录里（某一轮的提问、插进运行中的话、命令）出现了就不再单独画；还在排队时由排队那条显示，这条先藏着
// 只认发送前后才有的记录，免得和以前发过的同样一句话对上；两分钟还没出现也收掉（以记录为准）

function morphKids(a, b) {
  const an = [...a.childNodes], bn = [...b.childNodes];
  bn.forEach((n, i) => {
    const o = an[i];
    if (!o) return a.appendChild(n);
    if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName) return a.replaceChild(n, o);
    if (n.nodeType === 1 && o.getAttribute("data-fk") !== n.getAttribute("data-fk")) return a.replaceChild(n, o);   // 输入框换了归属（如问题卡换到下一题）：换新的，不沿用上一题打的字
    if (n.nodeType !== 1) {
      if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue;
      return;
    }
    for (const { name } of [...o.attributes]) if (!n.hasAttribute(name) && name !== "open") o.removeAttribute(name);   // 展开的工具详情由用户开合
    for (const { name, value } of [...n.attributes]) if (o.getAttribute(name) !== value) o.setAttribute(name, value);

  const atBottom = CHAT.stick || box.scrollTop + box.clientHeight >= box.scrollHeight - 60;
  const anchor = atBottom ? null : [...box.children].find((el) => el.offsetTop + el.offsetHeight > box.scrollTop),
    off = anchor ? anchor.offsetTop - box.scrollTop : 0;
  CHAT.io.clear();
  const items = convItems();
  const cur = new Map([...box.children].map((el) => [el.dataset.key, el]));
  let prev = null;
  for (const x of items) {
    let el = cur.get(x.key);

async function chatLoad(withStatus) {

  const gen = API_GEN;                                        // 拉取途中点了按钮（问题卡翻页、加减工具等）：这次拉到的是旧状态，丢掉，免得先跳回去再跳过来
  const [h, s] = await Promise.all([
    api(`/api/chat/history?limit=20${have ? `&have=${encodeURIComponent(have)}` : ""}`),
    withStatus || !CHAT.status ? api("/api/chat/status").catch(() => null) : null,   // 状态栏读不到不影响对话
  ]);
  if (gen !== API_GEN) return;

  }

  if (inp) inp.placeholder = chatHint(h.task);   // 开关切换了接私信的任务：换成它的对话
  CHAT.hist = h;
  if (!CHAT.older.length) CHAT.more = h.more;
  redrawConv();                                              // 先画对话，再等任务定义、工具刷新工具栏（任务接口慢，别让对话跟着等）

  }

  CHAT.sending = true;
  // 点了发送就先把这条显示在对话里（发送中），等对话记录里出现它再换成正式的那条；不用等服务器回话、排进队才看得到
  const echo = { ts: Date.now() / 1000, text: text.trim(), sent: false,
    imgs: files.filter((f) => f.type.startsWith("image/")).map((f) => f.url), docs: files.filter((f) => !f.type.startsWith("image/")).map((f) => f.name) };
  CHAT.echo.push(echo);
  CHAT.files = [];
  const pf = $("#pendfiles");
  if (pf) pf.innerHTML = "";
  const inp = $("#chatin");
  if (inp && inp.value === text) {
    inp.value = "";
    autosize(inp);
  }
  cmdPop();                                             // 发出去了：收起命令候选
  CHAT.stick = true;
  redrawConv(true);
  try {
    let r;
    try {
      r = await api("/api/chat/send", {
        method: "POST",
        body: JSON.stringify({ text, files }),
      });
    } catch (e) {                                       // 没发出去：撤回这条，字和附件放回去
      CHAT.echo = CHAT.echo.filter((x) => x !== echo);
      CHAT.files = files;
      if (pf) pf.innerHTML = pendHTML();
      if (inp && !inp.value) { inp.value = text; autosize(inp); }
      redrawConv(true);
      throw e;
    }
    echo.sent = true;
    if (r.skipped?.length)
      toast(
        `跳过了 ${r.skipped.join("、")}：只收 10 MB 以内的文件`,
        true,
      );
    await chatLoad(true);
    D.tasks = await api("/api/tasks");
    const tb = $("#tbar");
    if (tb) tb.innerHTML = toolbarHTML();
  } catch (e) {
    toast(e.message, true);
  } finally {
    CHAT.sending = false;
  }
}
function autosize(t) {
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 220) + "px";
}
async function addFiles(list) {
  for (const f of list) {
    if (f.size > 10 * 1024 * 1024) {
      toast(`${f.name} 超过 10 MB`, true);
      continue;
    }
    const data = await new Promise((ok, bad) => {
      const r = new FileReader();
      r.onload = () => ok(String(r.result).split(",")[1] || "");
      r.onerror = bad;
      r.readAsDataURL(f);
    });
    CHAT.files.push({
      name: f.name,
      type: f.type || "application/octet-stream",
      data,
      url: URL.createObjectURL(f),
    });
  }
  const pf = $("#pendfiles");
  if (pf) pf.innerHTML = pendHTML();
}
function cmdPop() {
  const inp = $("#chatin"),
    pop = $("#cmdpop");
  if (!inp || !pop) return;
  const v = inp.value;
  const hits =
    v.startsWith("/") && !v.includes("\n")
      ? completions().filter(([c]) => c.startsWith(v.trim().toLowerCase()) || c.startsWith(v.toLowerCase()))
      : [];
  if (hits.length === 1 && hits[0][0] === v.trim().toLowerCase()) hits.length = 0;   // 已经是完整命令：不用再提示，回车就执行
  pop.hidden = !hits.length;
  CHAT.cmdSel = Math.min(CHAT.cmdSel, Math.max(0, hits.length - 1));
  pop.innerHTML = hits
    .map(([c, d], i) => `<button class="${i === CHAT.cmdSel ? "on" : ""}" data-pickcmd="${esc(c)}"><code>${esc(c)}</code><span>${esc(d)}</span></button>`)
    .join("");
  return hits;
}
async function cardAct(id, action, value) {
  try {
    const r = await api(`/api/chat/cards/${id}`, {
      method: "POST",
      body: JSON.stringify({ action, value }),
    });
    if (r.note) toast(r.note);
    // 先原地换上服务器返回的新卡，不等整段对话重拉
    for (const t of [...CHAT.older, ...(CHAT.hist?.turns || []), CHAT.hist || {}]) {
      const k = (t.cards || []).findIndex((c) => c.id === id);
      if (k >= 0) t.cards[k] = r.card;
    }
    redrawConv(true);
    chatLoad().catch(() => {});
  } catch (e) {
    toast(e.message, true);
  }
}

    CHAT.v3dClose = null;

  const of = e.target.dataset?.otherfor;
  if (of && e.key === "Enter") {
    e.preventDefault();
    return cardAct(of, "other", e.target.value);
  }
  if (e.target.id !== "chatin" || e.isComposing || e.keyCode === 229) return;   // 输入法组字中的回车（Safari 确认英文时 isComposing 是 false，只能看 229）
  const pop = $("#cmdpop"),
    hits = pop && !pop.hidden ? cmdPop() : [];
  if (hits?.length && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    CHAT.cmdSel =
      (CHAT.cmdSel + (e.key === "ArrowDown" ? 1 : hits.length - 1)) %
      hits.length;
    cmdPop();
    return;
  }
  if (hits?.length && e.key === "Tab") {
    e.preventDefault();
    e.target.value = hits[CHAT.cmdSel][0];
    cmdPop();
    return;
  }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    if (hits?.length && e.target.value.trim() !== hits[CHAT.cmdSel][0]) {
      e.target.value = hits[CHAT.cmdSel][0];
      cmdPop();
      return;

      // ---------- 路由 ----------
      const route = () =>
        (location.hash.replace(/^#\/?/, "") || "tasks")
          .split("/")
          .map(decodeURIComponent);

        const p = route();

        if (!later) view.classList.toggle("chatwrap", p[0] === "chat");
        if (!D.loaded) {
          view.innerHTML = `<div class="empty">加载中…</div>`;
          return;

        if (p[0] === "tasks" && p[1]) view.innerHTML = viewTask(p[1]);
        else if (p[0] === "runs" && p[2]) {
          const key = location.hash;
          const h = await viewRun(p[1], p[2]);
          if (key === location.hash) { view.classList.remove("chatwrap"); view.innerHTML = h; }
        } else if (p[0] === "chat") {
          CHAT.sig = ""; CHAT.stick = true;

          const key = location.hash;

      const NAV = [location.hash || "#/tasks"];

        const prev = NAV.length > 1 ? NAV[NAV.length - 2] : null;

        const p = h.replace(/^#\/?/, "").split("/").map(decodeURIComponent);

        if (NAV.length > 1 && NAV[NAV.length - 2] === location.hash) NAV.pop();
