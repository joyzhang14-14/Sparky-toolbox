[project]
name = "open-web-access"
version = "0.1.0"
description = "Open Web Access：串行研究容器内的搜索、抓取、解析与研究循环"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "trafilatura>=2.2.0",
    "pymupdf>=1.28.2",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "pillow>=12.3.0",
    "fastembed>=0.8.0",
    "mcp>=2.2.0",
    "pyyaml>=6.0.3",
    "discord-py>=2.7.1",
    "caldav>=3.3.1",
    "sandlock==0.8.9",
]

[project.scripts]
stb = "control_center.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 研究引擎在 services/owa-research，装成顶层包 owa_research（工具、子代理、任务的代码在各自文件夹里，不装成包）
packages = ["services/owa-research/owa_research", "control_center", "channels"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.basedpyright]
# 类型检查（basedpyright = pyright 的分支，检查程序打包在 wheel 里，断网的测试容器也能跑）；强度同 pyright 默认的 standard
include = ["control_center"]
exclude = ["control_center/builder/examples", "**/__pycache__"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
