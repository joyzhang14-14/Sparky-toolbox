<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Mac / Office 常用字体 → 镜像里外形或字宽相近的开源字体（render_office 用 LibreOffice 排版时替换，尽量接近 Keynote / PowerPoint）。
     Arial / Times / Courier New / Calibri / Cambria 由 fonts-liberation、carlito、caladea 自带的规则处理。 -->
<fontconfig>
  <alias binding="same"><family>Arial Black</family><prefer><family>Archivo Black</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family></prefer></alias>
  <alias binding="same"><family>Impact</family><prefer><family>Anton</family></prefer></alias>
  <alias binding="same"><family>Trebuchet MS</family><prefer><family>Fira Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>PingFang SC</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
</fontconfig>
